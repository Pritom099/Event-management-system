<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="api-base" content="../backend/index.php/api">
    <title>Sign in · Gather</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="js/app.js" defer></script>
</head>

<body data-page="login">
    <main class="form-layout">
        <form class="form-card" id="auth-form" data-mode="login">
            <p class="section-kicker">Good to see you</p>
            <h1>Welcome back.</h1>
            <p>Sign in to pick up where you left off.</p>
            <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email"
                    autocomplete="email" required></div>
            <div class="field"><label for="password">Password</label><input id="password" name="password"
                    type="password" autocomplete="current-password" required minlength="8"></div><button class="btn"
                type="submit">Sign in <i class="fa-solid fa-arrow-right"></i></button>
            <p class="form-foot">New around here? <a href="register.html">Create an account</a></p>
        </form>
    </main>
</body>

</html>
