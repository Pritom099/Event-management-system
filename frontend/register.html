<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="api-base" content="../backend/index.php/api">
    <title>Join Gather</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="js/app.js" defer></script>
</head>

<body data-page="register">
    <main class="form-layout">
        <form class="form-card" id="auth-form" data-mode="register">
            <p class="section-kicker">Your next plan starts here</p>
            <h1>Come on in.</h1>
            <p>Create an attendee account. Organizers are approved by a platform administrator.</p>
            <div class="field"><label for="name">Your name</label><input id="name" name="name" autocomplete="name"
                    required minlength="2"></div>
            <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email"
                    autocomplete="email" required></div>
            <div class="field"><label for="password">Password</label><input id="password" name="password"
                    type="password" autocomplete="new-password" required minlength="8"></div><button class="btn"
                type="submit">Create account <i class="fa-solid fa-arrow-right"></i></button>
            <p class="form-foot">Already have an account? <a href="login.html">Sign in</a></p>
        </form>
    </main>
</body>

</html>
